services:
  - type: web
    name: solar-roi
    runtime: python
    rootDir: solar_roi/src/cesium-local
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn "backend:create_app()" --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: solar-roi-db
          property: connectionString
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production

databases:
  - name: solar-roi-db
    plan: free
