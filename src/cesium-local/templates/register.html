<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Solar ROI Calculator - Register</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="register-page">
  <div class="top-strip">
    <div class="top-strip-left">
      <img class="gemini-logo" src="/static/images/Gemini_Generated_Image_d2r1zjd2r1zjd2r1.png" alt="Gemini">
    </div>
    <div class="top-strip-right">
      <button id="topAuthBtn" class="top-auth-btn">Login</button>
      <img src="/static/images/kosen_logo.png" alt="Kosen" style="background: transparent; padding: 0; margin: 0; border: none; box-shadow: none; height: 46px; width: auto;">
      <img src="/static/images/cesium_logo.png" alt="Cesium" style="background: transparent; padding: 0; margin: 0; border: none; box-shadow: none; height: 46px; width: auto;">
    </div>
  </div>

  <div class="sub-strip">
    <div class="sub-strip-left">
      <a href="/app">Workspace</a>
      <a href="/calculate">Analysis</a>
    </div>
  </div>

  <main class="register-main">
    <section class="register-shell">
      <div class="register-panel">
        <div class="panel-header">
          <div class="panel-title">Create Operator Profile</div>
          <div class="panel-tag">Revision 2.6</div>
        </div>
        <div class="panel-body">
          <div class="register-error" id="authError"></div>
          <form id="registerForm" class="register-form">
            <div class="form-group">
              <label for="regName">Operator Name</label>
              <input type="text" id="regName" name="name" placeholder="Full name" required>
            </div>
            <div class="form-group">
              <label for="regEmail">Email Address</label>
              <input type="email" id="regEmail" name="email" placeholder="name@email.com" required>
            </div>
            <div class="form-group">
              <label for="regPassword">Access Key</label>
              <input type="password" id="regPassword" name="password" placeholder="Min. 6 characters" required>
            </div>
            <div class="form-group">
              <label for="regConfirm">Confirm Access Key</label>
              <input type="password" id="regConfirm" name="confirmPassword" placeholder="Repeat password" required>
            </div>
            <div class="register-actions">
              <button type="submit" class="register-btn">Provision Profile</button>
              <div class="register-footer">Already registered? <a href="/login">Sign in</a></div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div class="register-status">
    <span>System: Nominal</span>
    <span>Console: SOLAR-ROI / v2.6</span>
    <span>Security: Active</span>
  </div>

  <script>
    (function() {
      const AUTH_KEY = "solar_demo_auth";
      const USER_KEY = "solar_auth_user";
      const isGuest = !(sessionStorage.getItem(AUTH_KEY) && sessionStorage.getItem(USER_KEY));
      const topBtn = document.getElementById("topAuthBtn");
      if (topBtn) {
        if (isGuest) {
          topBtn.textContent = "Login";
          topBtn.onclick = () => { window.location.href = "/login"; };
        } else {
          topBtn.textContent = "Logout";
          topBtn.onclick = (e) => {
            e.preventDefault();
            sessionStorage.removeItem(AUTH_KEY);
            sessionStorage.removeItem(USER_KEY);
            localStorage.removeItem("solar_wizard_session");
            window.location.href = "/login";
          };
        }
      }
      const logoutLink = document.getElementById("logoutLink");

      if (logoutLink) {
        logoutLink.addEventListener("click", (event) => {
          event.preventDefault();
          sessionStorage.removeItem(AUTH_KEY);
          sessionStorage.removeItem(USER_KEY);
          localStorage.removeItem("solar_wizard_session");
          window.location.href = "/login";
        });
      }

      const form = document.getElementById("registerForm");
      const errorEl = document.getElementById("authError");

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("show");
      }

      function hideError() {
        errorEl.classList.remove("show");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const password = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regConfirm").value;

        if (!name || !email || !password) {
          showError("Please fill in all fields");
          return;
        }

        if (password !== confirm) {
          showError("Passwords do not match");
          return;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters");
          return;
        }

        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: name, email: email, password: password })
          });

          const result = await response.json();

          if (!response.ok) {
            showError(result.error || "Registration failed");
            return;
          }

          sessionStorage.setItem(AUTH_KEY, "1");
          sessionStorage.setItem(USER_KEY, JSON.stringify(result.user));
          window.location.href = "/app";
        } catch (error) {
          console.error("Register error:", error);
          showError("Connection error. Please try again.");
        }
      });
    })();
  </script>
</body>
</html>
