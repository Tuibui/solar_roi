<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Solar ROI Calculator - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css?v=20260305">
  <link rel="stylesheet" href="/static/css/auth.css?v=20260305">
  <script src="/static/js/shared/utils.js?v=20260305"></script>
  <script src="/static/js/shared/i18n.js?v=20260305"></script>
</head>
<body class="login-page">
  <div class="top-strip">
    <div class="top-strip-left">
      <img class="gemini-logo" src="/static/images/Gemini_Generated_Image_d2r1zjd2r1zjd2r1.png" alt="Gemini">
    </div>
    <div class="top-strip-right">
      <div class="top-bar-group">
        <span class="top-bar-label" data-i18n="top.lang">LANG</span>
        <select id="globalLangSelect" class="top-bar-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="th">TH</option>
          <option value="ja">JA</option>
        </select>
      </div>
      <div class="top-bar-group">
        <span class="top-bar-label" data-i18n="top.currency">CURRENCY</span>
        <select id="globalCurrencySelect" class="top-bar-select" aria-label="Currency">
          <option value="USD">USD $</option>
          <option value="THB" selected>THB ฿</option>
          <option value="JPY">JPY ¥</option>
          <option value="EUR">EUR €</option>
          <option value="GBP">GBP £</option>
          <option value="CNY">CNY ¥</option>
          <option value="KRW">KRW ₩</option>
          <option value="AUD">AUD A$</option>
          <option value="INR">INR ₹</option>
        </select>
      </div>
      <button id="topAuthBtn" class="top-auth-btn" data-i18n="top.login">Login</button>
      <img src="/static/images/kosen_logo.png" alt="Kosen" style="background: transparent; padding: 0; margin: 0; border: none; box-shadow: none; height: 46px; width: auto;">
      <img src="/static/images/cesium_logo.png" alt="Cesium" style="background: transparent; padding: 0; margin: 0; border: none; box-shadow: none; height: 46px; width: auto;">
    </div>
  </div>

  <div class="sub-strip">
    <div class="sub-strip-left">
      <a href="/app" data-i18n="nav.workspace">Workspace</a>
      <a href="/calculate" data-i18n="nav.analysis">Analysis</a>
    </div>
  </div>

  <main class="login-main">
    <section class="login-shell">
      <div class="login-panel">
        <div class="panel-header">
          <div class="panel-title" data-i18n="login.title">Operator Login</div>
          <div class="panel-tag" data-i18n="login.tag">Revision 2.6</div>
        </div>
        <div class="panel-body">
          <div class="login-error" id="loginError"></div>
          <form id="loginForm" class="login-form">
            <div class="form-group">
              <label for="loginEmail" data-i18n="login.operator_id">Operator ID</label>
              <input type="text" id="loginEmail" name="email" data-i18n-ph="login.operator_id_ph" placeholder="Email or username" required>
            </div>
            <div class="form-group">
              <label for="loginPassword" data-i18n="login.access_key">Access Key</label>
              <input type="password" id="loginPassword" name="password" data-i18n-ph="login.access_key_ph" placeholder="Enter password" required>
            </div>
            <div class="login-actions">
              <button type="submit" class="login-btn" data-i18n="login.submit">Engage Session</button>
              <div class="login-footer"><span data-i18n="login.footer">Need credentials?</span> <a href="/register" data-i18n="login.footer_link">Create an account</a></div>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div class="login-status">
    <span data-i18n="login.status_system">System: Nominal</span>
    <span data-i18n="login.status_console">Console: SOLAR-ROI / v2.6</span>
    <span data-i18n="login.status_security">Security: Active</span>
  </div>

  <script>
    (function() {
      const AUTH_KEY = "solar_demo_auth";
      const USER_KEY = "solar_auth_user";

      const isGuest = !(sessionStorage.getItem(AUTH_KEY) && sessionStorage.getItem(USER_KEY));

      // Top bar auth button
      const topBtn = document.getElementById("topAuthBtn");
      if (topBtn) {
        if (isGuest) {
          topBtn.textContent = "Login";
          topBtn.onclick = () => window.location.href = "/login";
        } else {
          topBtn.textContent = "Logout";
          topBtn.onclick = (e) => {
            e.preventDefault();
            sessionStorage.removeItem(AUTH_KEY);
            sessionStorage.removeItem(USER_KEY);
            localStorage.removeItem("solar_wizard_session");
            window.location.href = "/login";
          };
        }
      }


      if (!isGuest) {
        // Already logged in → go to app
        window.location.replace("/app");
        return;
      }

      const form = document.getElementById("loginForm");
      const errorEl = document.getElementById("loginError");

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("show");
      }

      function hideError() {
        errorEl.classList.remove("show");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
          showError("Please enter email and password");
          return;
        }

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: email, password: password })
          });

          const result = await response.json();

          if (!response.ok) {
            showError(result.error || "Login failed");
            return;
          }

          sessionStorage.setItem(AUTH_KEY, "1");
          sessionStorage.setItem(USER_KEY, JSON.stringify(result.user));
          window.location.href = "/app";
        } catch (error) {
          console.error("Login error:", error);
          showError("Connection error. Please try again.");
        }
      });
    })();
  </script>
</body>
</html>
