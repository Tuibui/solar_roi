<html lang="en">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }

</head>
<body>
  <script>
    (function() {
      const AUTH_KEY = "solar_demo_auth";
      if (!sessionStorage.getItem(AUTH_KEY)) {
        window.location.replace("/login");
      }
    })();
  </script>

  <div class="top-strip">
    <img src="/static/images/kosen_logo.png" alt="Kosen">
    <img src="/static/images/cesium_logo.png" alt="Cesium">
  </div>

  <div class="sub-strip">
    <div class="sub-strip-left">
      <div class="sub-strip-title">Solar ROI Calculator</div>
      <a href="/app" class="active">User information</a>
      <a href="/calculate">Calculation</a>
    </div>
    <a href="#" id="logoutLink" class="sub-strip-logout">Logout</a>
  </div>

  <div id="wizardOverlay">
    <span id="wizardOverlayMsg">Generating...</span>
  </div>

  <!-- Map Mode -->
  <div id="mapMode" class="map-mode active">
    <div class="map-stage">
      <div id="wizardCesiumContainer"></div>

      <div class="map-controls">
        <div class="map-search-box">
          <div class="map-controls-row">
            <div class="search-input-wrapper map-search">
              <input type="text" id="addressInput" class="search-input" placeholder="Enter an address or place">
              <div class="suggestions" id="suggestions"></div>
            </div>
            <button class="btn-search-action" id="searchBtn" type="button">Search</button>
            <button class="btn-search-action btn-detect" id="btnDetectLocation" type="button">Detect</button>
            <div class="toolbar-divider"></div>
            <div id="wizardToolbar" class="map-toolbar">
              <button id="btnDrawRoof" class="toolbar-btn" title="Draw Roof"><img src="/static/images/blueprint.png" alt="Draw" style="width:20px;height:20px;vertical-align:middle;"></button>
              <button id="btnUndo" class="toolbar-btn" disabled title="Undo Point"><img src="/static/images/undo.png" alt="Undo" style="width:18px;height:18px;vertical-align:middle;"></button>
              <button id="btnRedo" class="toolbar-btn" disabled title="Redo Point"><img src="/static/images/redo.png" alt="Redo" style="width:18px;height:18px;vertical-align:middle;"></button>
              <button id="btnReset" class="toolbar-btn" title="Reset"><img src="/static/images/reset.png" alt="Reset" style="width:18px;height:18px;vertical-align:middle;"></button>
            </div>
          </div>
          <div id="addressSelected" class="address-selected" style="display:none;"></div>
          <div id="detectLocationStatus" class="form-hint map-status"></div>
        </div>
      </div>
      
      <!-- Bottom Right of Map: Big Analyze Button (Icon Only) -->
      <div class="analyze-button-container">
        <button id="btnAnalyze" class="btn-analyze-big" title="Analyze">
          <img src="/static/images/next.png" alt="Analyze">
        </button>
      </div>
    </div>
  </div>

  <!-- Split View (Model + Form) -->
  <div class="split-view hidden" id="splitView">
    <div class="split-left">

      <!-- Project Tree Panel (SolidWorks FeatureManager) -->
      <div class="project-tree-panel" id="projectTreePanel">
        <div class="ptree-header">
          <span class="ptree-header-title">Tree</span>
          <input type="text" class="ptree-filter" id="ptreeFilter" placeholder="🔍 Filter..." autocomplete="off" spellcheck="false">
          <button class="ptree-toggle-btn" id="btnTreeToggle" title="Collapse tree">◀</button>
        </div>
        <div class="ptree-body" id="projectTreeBody"></div>
        <div class="ptree-status-bar">
          <span class="ptree-status-text" id="ptreeStatusText">Ready</span>
        </div>
      </div>

      <!-- 3D Viewer Column -->
      <div class="split-viewer-col">
      <div class="split-viewer-wrap">
        <div id="splitModelHost"></div>

        <!-- SolidWorks-style toolbar (top-left) -->
        <div class="cad-toolbar" id="cadToolbar">
          <button class="cad-btn" id="btnSelectPlane" title="Select a roof face">
            <span class="cad-icon">⬡</span> Select Plane
          </button>
          <div class="cad-separator"></div>
          <div class="cad-dropdown-wrap">
            <button class="cad-btn" id="btnInstallPanel" title="Place solar panel" disabled>
              <span class="cad-icon">⊞</span> Install Panel <span class="cad-caret">▾</span>
            </button>
            <div class="cad-dropdown" id="panelDropdown">
              <button class="cad-dropdown-item" data-panel="solar_panel">Standard Panel</button>
              <button class="cad-dropdown-item" data-panel="solar_panel_72">72-Cell Panel</button>
              <button class="cad-dropdown-item" data-panel="solar_panel_120">120-Cell Panel</button>
            </div>
          </div>
          <div class="cad-separator"></div>
          <button class="cad-btn" id="btnPlacerUndo" title="Undo (Ctrl+Z)" disabled>
            <span class="cad-icon">↩</span>
          </button>
          <button class="cad-btn" id="btnPlacerRedo" title="Redo (Ctrl+Shift+Z)" disabled>
            <span class="cad-icon">↪</span>
          </button>
        </div>

        <!-- Sketch mode confirm/cancel (top-right) -->
        <div class="sketch-confirm-bar hidden" id="sketchConfirmBar">
          <button class="sketch-btn sketch-btn-ok" id="btnSketchFinish" title="Finish sketch">✓</button>
          <button class="sketch-btn sketch-btn-cancel" id="btnSketchCancel" title="Cancel sketch">✗</button>
        </div>

        <!-- Sketch mode indicator -->
        <div class="sketch-mode-badge hidden" id="sketchModeBadge">SKETCH MODE</div>
      </div>
      <div class="split-viewer-toolbar">
        <button class="btn-small" id="btnEditRoof" type="button">Edit Roof</button>
      </div>
      </div><!-- /.split-viewer-col -->
    </div>
    <div class="split-right" id="splitRight">
      <button class="split-collapse-btn" id="btnCollapseRight" title="Collapse/Expand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <header class="split-header">
        <span>Project Details</span>
      </header>
      <div class="split-form-body" id="splitFormBody">

        <!-- Section 1: Appliances -->
        <div class="form-section">
          <h3 class="form-section-title">Appliances</h3>
          <div class="form-group">
            <label for="wizardPresetAppliance">Add Preset Appliance</label>
            <div style="display: flex; gap: 8px;">
              <select id="wizardPresetAppliance" style="flex: 1;">
                <option value="">-- Select Appliance --</option>
                <option value="led|10">LED Light (10W)</option>
                <option value="fan|75">Ceiling Fan (75W)</option>
                <option value="fridge|150">Refrigerator (150W)</option>
                <option value="tv|120">TV (120W)</option>
                <option value="laptop|65">Laptop (65W)</option>
                <option value="desktop|250">Desktop PC (250W)</option>
                <option value="ac|900">Air Conditioner 9000BTU (900W)</option>
                <option value="washing|500">Washing Machine (500W)</option>
                <option value="microwave|1000">Microwave (1000W)</option>
                <option value="pump|750">Water Pump (750W)</option>
                <option value="custom">+ Custom Appliance...</option>
              </select>
              <button class="btn-small" style="padding: 8px 16px; background: #1a5276; color: white; border: none;" id="btnAddAppliance" type="button">+ Add</button>
            </div>
          </div>
          <div id="wizardAppliancesList" class="appliances-list"></div>
        </div>

        <!-- Section 2: Monthly Electric Bill -->
        <div class="form-section">
          <h3 class="form-section-title">Monthly Electric Bill</h3>
          <div class="form-group">
            <label for="wizardMonthlyKwh">Monthly Energy Usage (kWh/month)</label>
            <input type="number" id="wizardMonthlyKwh" step="1" placeholder="e.g., 500">
          </div>
        </div>

        <!-- Section 3: Electricity Price -->
        <div class="form-section">
          <h3 class="form-section-title">Electricity Price</h3>
          <div class="form-group">
            <label for="wizardTariff">Price per kWh</label>
            <div class="split-input-row">
              <input type="number" id="wizardTariff" step="0.01" min="0" value="4.5" placeholder="4.5">
              <select id="wizardCurrency" aria-label="Tariff currency">
                <option value="THB">THB</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="JPY">JPY</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Section 4: Grid Export Price -->
        <div class="form-section">
          <h3 class="form-section-title">Grid Export Price (Feed-in Tariff)</h3>
          <div class="form-group">
            <label for="splitExportPrice">Export price per kWh</label>
            <div class="split-input-row">
              <input type="number" id="splitExportPrice" step="0.01" min="0" placeholder="2.2">
              <span class="export-currency-label" id="exportCurrencyLabel">THB</span>
            </div>
            <p class="form-hint">Price your utility pays for exported solar energy.</p>
          </div>
        </div>

        <!-- Project Name + Save -->
        <div class="form-section">
          <h3 class="form-section-title">Save Project</h3>
          <div class="form-group">
            <label for="splitProjectName">Project Name</label>
            <input type="text" id="splitProjectName" placeholder="My Solar Project">
          </div>
          <div id="splitSaveMsg" style="display:none;" class="success-message"></div>
          <button class="split-save-btn" id="btnSplitSave" type="button">Save Project</button>
        </div>

      </div>
    </div>
  </div>

  

  <!-- Scripts -->
  <script src="/Build/Cesium/Cesium.js"></script>
  <script src="/static/js/shared/config.js?v=20260219"></script>
  <script src="/static/js/shared/utils.js?v=20260219"></script>
  <script src="/static/js/app/map.js?v=20260219"></script>
  <script src="/static/js/app/draw.js?v=20260219"></script>
  <script src="/static/js/app/api.js?v=20260219"></script>
  <script src="/static/js/app/search.js?v=20260219"></script>
  <script src="/static/js/app/inputs.js?v=20260219"></script>
  <script src="/static/js/app/wizard.js?v=20260219"></script>
  <script src="/static/js/app/project-tree.js?v=20260221b"></script>
  <script src="/static/js/app/main.js?v=20260221"></script>
  <script src="/static/js/app/panel-placer.js?v=20260220"></script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    window.THREE = THREE;

    function createViewer(host, options = {}) {
      const bgColor = options.bgColor || 0xffffff;
      const gridColor = options.gridColor || 0xcccccc;
      const w = host.clientWidth || 400;
      const h = host.clientHeight || 400;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(bgColor);

      const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 1000);
      camera.position.set(0, 5, 10);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(window.devicePixelRatio);
      host.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.12;

      

      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(5, 10, 5);
      scene.add(dir);

      let animId;
      function animate() {
        animId = requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      function resize() {
        const nw = host.clientWidth;
        const nh = host.clientHeight;
        if (nw && nh) {
          camera.aspect = nw / nh;
          camera.updateProjectionMatrix();
          renderer.setSize(nw, nh);
        }
      }
      window.addEventListener('resize', resize);

      return { scene, camera, renderer, controls, resize, dispose: () => cancelAnimationFrame(animId) };
    }

    function loadModelToViewer(viewer, url, roofIndex, onReady, onError) {
      const loader = new GLTFLoader();
      loader.load(url, (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        model.position.sub(center);
        // 3D model: auto-scale for visual
        const maxDim = Math.max(size.x, size.y, size.z);
        model.scale.setScalar(5 / (maxDim || 1));
        
        // Roof: lay flat with base parallel to ground, facing UP
        // Step 1: Rotate 90° around X to lay flat
        model.rotation.x =+Math.PI / 2;;
        
        model.updateMatrixWorld(true);
        const groundedBox = new THREE.Box3().setFromObject(model);
        model.position.y -= groundedBox.min.y;
        model.position.y += 0.1; // Small offset from ground plane
        viewer.scene.add(model);

        // Expose model root for scatter alignment
        viewer.modelRoot = model;

        // Add XYZ axes at model center for orientation
        const axes = new THREE.AxesHelper(2);
        axes.name = 'model-axes';
        axes.visible = false;
        const modelBox = new THREE.Box3().setFromObject(model);
        const modelCenter = modelBox.getCenter(new THREE.Vector3());
        axes.position.copy(modelCenter);
        model.add(axes);
        
        viewer.camera.position.set(0, 5, 10);
        viewer.controls.target.set(0, 0, 0);
        viewer.controls.update();
        if (onReady) onReady(model);
      }, undefined, (err) => {
        console.error('GLB load error', err);
        if (onError) onError(err);
      });
    }


    window.threeViewer = { createViewer, loadModelToViewer };

    // ──── Panel Placer Wiring (GLTFLoader available in module scope) ────
    let panelPlacer = null;
    window.getPanelPlacer = () => panelPlacer;
    window.resetPanelPlacer = () => {
      if (panelPlacer) {
        panelPlacer.destroy();
        panelPlacer = null;
      }
    };

    const PANEL_MODELS = {
      solar_panel:     { url: '/static/models/solar_panel.glb',     label: 'Standard Panel' },
      solar_panel_72:  { url: '/static/models/solar_panel_72.glb',  label: '72-Cell Panel' },
      solar_panel_120: { url: '/static/models/solar_panel_120.glb', label: '120-Cell Panel' }
    };

    async function ensurePanelPlacer() {
      const viewer = window.splitViewerRef;
      if (!viewer || !window.PanelPlacer) return null;
      if (panelPlacer) return panelPlacer;

      panelPlacer = new PanelPlacer(viewer);
      panelPlacer.setLoaderClass(GLTFLoader);

      // Pre-load first model
      const firstKey = Object.keys(PANEL_MODELS)[0];
      await panelPlacer.loadPanelModel(firstKey, PANEL_MODELS[firstKey].url);
      panelPlacer.setActiveModel(firstKey);

      panelPlacer.init();

      // State change handler — update UI
      panelPlacer.onStateChange = (state) => {
        const isSketch = state === PlacerState.SKETCH;
        const isSelecting = state === PlacerState.SELECT_PLANE;

        // Show/hide sketch UI
        document.getElementById('sketchConfirmBar')?.classList.toggle('hidden', !isSketch);
        document.getElementById('sketchModeBadge')?.classList.toggle('hidden', !isSketch);

        // Toggle button states
        const btnSelect = document.getElementById('btnSelectPlane');
        const btnInstall = document.getElementById('btnInstallPanel');
        const btnUndo = document.getElementById('btnPlacerUndo');
        const btnRedo = document.getElementById('btnPlacerRedo');

        if (btnSelect) btnSelect.classList.toggle('active', isSelecting);
        if (btnInstall) btnInstall.disabled = !isSketch;
        if (btnUndo) btnUndo.disabled = !isSketch;
        if (btnRedo) btnRedo.disabled = !isSketch;
      };

      console.log('[PanelPlacer] Initialized');
      return panelPlacer;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Select Plane
      document.getElementById('btnSelectPlane')?.addEventListener('click', async () => {
        const pp = await ensurePanelPlacer();
        if (!pp) return;
        if (pp.state === PlacerState.SELECT_PLANE) {
          pp.exitSelectPlane();
        } else if (pp.state === PlacerState.IDLE) {
          pp.enterSelectPlane();
        }
      });

      // Install Panel dropdown toggle
      const btnInstall = document.getElementById('btnInstallPanel');
      const dropdown = document.getElementById('panelDropdown');
      if (btnInstall && dropdown) {
        btnInstall.addEventListener('click', () => {
          dropdown.classList.toggle('open');
        });
        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
          if (!btnInstall.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.classList.remove('open');
          }
        });
      }

      // Dropdown item selection
      document.querySelectorAll('.cad-dropdown-item').forEach(item => {
        item.addEventListener('click', async () => {
          const key = item.dataset.panel;
          if (!key) return;
          dropdown?.classList.remove('open');

          const pp = await ensurePanelPlacer();
          if (!pp) return;

          // Load model if needed
          if (!pp.panelModels[key] && PANEL_MODELS[key]) {
            btnInstall.disabled = true;
            btnInstall.querySelector('.cad-icon').textContent = '⏳';
            try {
              await pp.loadPanelModel(key, PANEL_MODELS[key].url);
            } finally {
              btnInstall.disabled = false;
              btnInstall.querySelector('.cad-icon').textContent = '⊞';
            }
          }

          pp.setActiveModel(key);
          pp.startInstall();

          // Update button label
          btnInstall.childNodes[1].textContent = ` ${PANEL_MODELS[key]?.label || key} `;
        });
      });

      // Undo / Redo
      document.getElementById('btnPlacerUndo')?.addEventListener('click', () => {
        if (panelPlacer) panelPlacer.undo();
      });
      document.getElementById('btnPlacerRedo')?.addEventListener('click', () => {
        if (panelPlacer) panelPlacer.redo();
      });

      // Finish / Cancel sketch
      document.getElementById('btnSketchFinish')?.addEventListener('click', () => {
        if (panelPlacer) panelPlacer.finishSketch();
      });
      document.getElementById('btnSketchCancel')?.addEventListener('click', () => {
        if (panelPlacer) panelPlacer.cancelSketch();
      });
    });
  </script>
  <script>
    (function() {
      const logoutLink = document.getElementById("logoutLink");
      if (!logoutLink) return;
      logoutLink.addEventListener("click", (event) => {
        event.preventDefault();
        sessionStorage.removeItem("solar_demo_auth");
        sessionStorage.removeItem("solar_auth_user");
        localStorage.removeItem("solar_wizard_session");
        window.location.href = "/login";
      });
    })();
  </script>
</body>
